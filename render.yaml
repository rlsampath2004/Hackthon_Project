services:
  # Spring Boot Java 21 Backend Web Service
  - type: web
    name: finwise-backend
    runtime: java
    plan: free
    region: oregon
    buildCommand: cd finwise && chmod +x ./mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar finwise/target/finwise-0.0.1-SNAPSHOT.jar --server.port=$PORT
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # React Single Page App (Static Site)
  - type: web
    name: finintel-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
      - key: REACT_APP_GEMINI_API_KEY
        sync: false

