services:
  # Spring Boot Java 21 Backend Web Service
  - type: web
    name: finwise-backend
    runtime: docker
    dockerfilePath: ./finwise/Dockerfile
    dockerContext: ./finwise
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:finwise_db;DB_CLOSE_DELAY=-1;MODE=MySQL
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: password

  # React Single Page App (Global CDN Static Site)
  - type: web
    name: finintel-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: finwise-backend
          property: host
          prefix: https://
          suffix: /api
      - key: REACT_APP_GEMINI_API_KEY
        sync: false
