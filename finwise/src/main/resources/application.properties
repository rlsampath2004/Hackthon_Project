spring.application.name=finwise

server.port=8989

# Database related (Driver class is auto-detected by Spring Boot based on URL scheme: MySQL or H2)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finwise_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Passwordis2520}

# JPA/Hibernate related
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Google Gemini AI Integration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
